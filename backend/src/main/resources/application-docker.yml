server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/blackboxdb}
    username: ${DB_USERNAME:blackbox_user}
    password: ${DB_PASSWORD:blackbox_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none          # Flyway owns the schema (V1__init_schema.sql)
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC      # keep timestamps identical on write and read
        type:
          preferred_instant_jdbc_type: TIMESTAMP   # match the TIMESTAMP columns in the SQL file
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: blackbox-event-group
      auto-offset-reset: earliest

blackbox:
  kafka:
    enabled: ${KAFKA_ENABLED:false}     # false = PostgreSQL only; true needs the Kafka container
    topic: ai-agent-events
  ai:
    demo-mode: ${DEMO_MODE:true}
    api-key: ${OPENAI_API_KEY:}